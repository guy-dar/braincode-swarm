<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrainCode visualizer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e2e2e2;
    --sidebar-bg: #f7f7f7;
    --active-bg: #e6e6e6;
    --code-bg: #fafafa;
    --new-bg: #fff8dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --fg: #e6e6e6;
      --muted: #9aa0a6;
      --border: #3a3a3a;
      --sidebar-bg: #171717;
      --active-bg: #2a2a2a;
      --code-bg: #181818;
      --new-bg: #2e2a1a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .path { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  header label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  header select { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--sidebar-bg); color: var(--fg); }
  #status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4caf50; margin-right: 5px; vertical-align: middle; }
  #status.paused .dot { background: var(--muted); }
  button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--sidebar-bg);
    color: var(--fg);
    cursor: pointer;
  }
  button:hover { background: var(--active-bg); }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #sidebar {
    width: 280px;
    flex-shrink: 0;
    overflow-y: auto;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
  }
  #sidebar .empty {
    padding: 16px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .trajectory { border-bottom: 1px solid var(--border); }
  .trajectory-name {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .trajectory-name:hover { background: var(--active-bg); }
  .trajectory-name .caret { color: var(--muted); font-size: 10px; flex-shrink: 0; }
  /* In-flight indicator. A record's folder gets source.json when it starts and
     metadata.json only when it succeeds, so "no metadata.json" means either
     running now or abandoned by a killed run — told apart by mtime, since a
     stale folder would otherwise pulse forever. */
  .ball { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; align-self: center; }
  .ball.working { background: #4caf50; animation: pulse 1.4s ease-in-out infinite; }
  .ball.stalled { background: #c9a227; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .ball.working { animation: none; } }
  .trajectory-name .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trajectory.is-new .trajectory-name { background: var(--new-bg); }
  .file-list { padding: 0 0 6px 0; }
  .file-item {
    padding: 4px 12px 4px 26px;
    font-size: 12.5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    cursor: pointer;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-item:hover { background: var(--active-bg); }
  .file-item.active { background: var(--active-bg); color: var(--fg); font-weight: 600; }
  .file-item.bc { color: var(--fg); }
  #content {
    flex: 1;
    overflow: auto;
    padding: 0;
  }
  #content .placeholder {
    padding: 24px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }
  #content .file-header {
    position: sticky;
    top: 0;
    padding: 8px 16px;
    font-size: 12.5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #content .file-header .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #content .file-header .reloaded { color: #4caf50; }
  #content .file-header button {
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 5px;
    flex-shrink: 0;
  }
  #content .file-header button.copied { color: #4caf50; border-color: #4caf50; }
  pre {
    margin: 0;
    padding: 16px;
    background: var(--code-bg);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* shared token palette */
  .tok-comment { color: #6b8a5a; font-style: italic; }
  .tok-string  { color: #b0703c; }
  .tok-tag     { color: #b13a7a; font-weight: 600; }
  .tok-number  { color: #3a7ab1; }
  .tok-keyword { color: #7a4fb1; font-weight: 600; }
  .tok-func    { color: #2a8f7a; }
  /* markdown */
  .tok-md-head   { color: #b13a7a; font-weight: 700; }
  .tok-md-code   { color: #2a8f7a; background: color-mix(in srgb, currentColor 8%, transparent); }
  .tok-md-fence  { color: #2a8f7a; }
  .tok-md-strong { color: var(--fg); font-weight: 700; }
  .tok-md-em     { color: var(--fg); font-style: italic; }
  .tok-md-link   { color: #3a7ab1; text-decoration: underline; }
  .tok-md-marker { color: #7a4fb1; font-weight: 600; }
  .tok-md-quote  { color: #6b8a5a; font-style: italic; }
  .tok-md-rule   { color: var(--muted); }
  /* json */
  .tok-json-key   { color: #b13a7a; font-weight: 600; }
  .tok-json-str   { color: #b0703c; }
  .tok-json-num   { color: #3a7ab1; }
  .tok-json-lit   { color: #7a4fb1; font-weight: 600; }
  .tok-json-punct { color: var(--muted); }
  @media (prefers-color-scheme: dark) {
    .tok-comment { color: #8fbf7a; }
    .tok-string  { color: #e0a862; }
    .tok-tag     { color: #f06bb0; }
    .tok-number  { color: #6bb0f0; }
    .tok-keyword { color: #b98cf0; }
    .tok-func    { color: #5fd0b5; }
    .tok-md-head   { color: #f06bb0; }
    .tok-md-code   { color: #5fd0b5; }
    .tok-md-fence  { color: #5fd0b5; }
    .tok-md-link   { color: #6bb0f0; }
    .tok-md-marker { color: #b98cf0; }
    .tok-md-quote  { color: #8fbf7a; }
    .tok-json-key   { color: #f06bb0; }
    .tok-json-str   { color: #e0a862; }
    .tok-json-num   { color: #6bb0f0; }
    .tok-json-lit   { color: #b98cf0; }
  }
</style>
</head>
<body>

<header>
  <h1>BrainCode visualizer</h1>
  <button id="pick">Choose output folder…</button>
  <span class="path" id="path"></span>
  <span class="spacer"></span>
  <label>sort
    <select id="sort">
      <option value="name">name</option>
      <option value="newest" selected>newest first</option>
    </select>
  </label>
  <label>refresh
    <select id="interval">
      <option value="0">off</option>
      <option value="3000">3s</option>
      <option value="5000" selected>5s</option>
      <option value="15000">15s</option>
      <option value="60000">60s</option>
    </select>
  </label>
  <span id="status"></span>
</header>

<main>
  <div id="sidebar"><div class="empty">Pick a folder to browse its trajectories.</div></div>
  <div id="content"><div class="placeholder">Nothing selected yet.</div></div>
</main>

<input type="file" id="folder-input" webkitdirectory style="display:none">

<script>
// --- Highlighting -----------------------------------------------------
// Deliberately generic: BrainCode's canonized vocabulary isn't fixed yet
// (see swarm/reference/DESIGN_DOC.md), so the .bc highlighter only recognizes structure
// that's true of the language regardless of which constructs exist — turn
// tags, and the Python-inspired base grammar (strings, comments, numbers,
// generic keywords, function-call shape). No construct/package names assumed.
const KEYWORDS = [
  "import", "from", "as", "def", "class", "return", "if", "elif", "else",
  "for", "while", "in", "not", "and", "or", "is", "None", "True", "False",
  "lambda", "with", "try", "except", "finally", "raise", "yield", "pass",
  "break", "continue", "global", "nonlocal", "assert", "del", "async", "await"
];

const BC_RE = new RegExp([
  String.raw`(?<comment>#[^\n]*)`,
  String.raw`(?<string>'''[\s\S]*?'''|"""[\s\S]*?"""|'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")`,
  String.raw`(?<tag><\|[^\n>]*?\|>)`,
  String.raw`(?<number>\b\d+\.?\d*\b)`,
  String.raw`(?<keyword>\b(?:${KEYWORDS.join("|")})\b)`,
  String.raw`(?<func>[A-Za-z_][A-Za-z0-9_]*(?=\s*\())`,
].join("|"), "g");

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Generic tokenizer: walks the text once, wrapping the first match at each
// position and escaping everything in between. Alternation order therefore
// decides precedence when two patterns can start at the same index.
function tokenize(text, re, classOf) {
  let out = "", last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(text))) {
    if (m[0] === "") { re.lastIndex++; continue; }   // never spin on an empty match
    if (m.index > last) out += escapeHtml(text.slice(last, m.index));
    out += classOf(m);
    last = m.index + m[0].length;
  }
  return out + escapeHtml(text.slice(last));
}

function highlightBC(code) {
  return tokenize(code, BC_RE, (m) => {
    const g = m.groups;
    const cls = g.comment ? "tok-comment"
      : g.string ? "tok-string"
      : g.tag ? "tok-tag"
      : g.number ? "tok-number"
      : g.keyword ? "tok-keyword"
      : "tok-func";
    return `<span class="${cls}">${escapeHtml(m[0])}</span>`;
  });
}

// Markdown: highlights the *source* rather than rendering it, so what you see
// is what the task actually wrote — decisions.md is read as evidence, and
// rendering would hide malformed markup instead of showing it. Fences and
// inline code come first in the alternation so their contents aren't
// re-tokenized as markup.
const MD_RE = new RegExp([
  "(?<fence>^ {0,3}(?:```|~~~)[^\\n]*\\n[\\s\\S]*?(?:^ {0,3}(?:```|~~~)[^\\n]*$|$))",
  "(?<code>`+[^`\\n]+`+)",
  "(?<head>^ {0,3}#{1,6} [^\\n]*)",
  "(?<rule>^ {0,3}(?:[-*_] *){3,}$)",
  "(?<quote>^ {0,3}> ?[^\\n]*)",
  "(?<marker>^ {0,3}(?:[-*+]|\\d+[.)]) )",
  "(?<link>!?\\[[^\\]\\n]*\\]\\([^)\\n]*\\))",
  "(?<strong>\\*\\*[^*\\n]+\\*\\*|__[^_\\n]+__)",
  "(?<em>\\*[^*\\n]+\\*|_[^_\\n]+_)",
].join("|"), "gm");

function highlightMarkdown(text) {
  return tokenize(text, MD_RE, (m) => {
    const g = m.groups;
    if (g.fence) {
      // Highlight a fenced block's body with the .bc highlighter when the
      // fence says so — decisions.md often quotes BrainCode.
      const nl = m[0].indexOf("\n");
      const info = m[0].slice(0, nl);
      const rest = m[0].slice(nl + 1);
      if (/^\s*(?:```|~~~)\s*(?:bc|braincode)\s*$/.test(info)) {
        const closeAt = rest.lastIndexOf("\n");
        const hasClose = /^\s*(?:```|~~~)/.test(rest.slice(closeAt + 1));
        const body = hasClose ? rest.slice(0, closeAt) : rest;
        const close = hasClose ? rest.slice(closeAt) : "";
        return `<span class="tok-md-fence">${escapeHtml(info)}</span>\n`
             + highlightBC(body)
             + `<span class="tok-md-fence">${escapeHtml(close)}</span>`;
      }
      return `<span class="tok-md-fence">${escapeHtml(m[0])}</span>`;
    }
    const cls = g.code ? "tok-md-code"
      : g.head ? "tok-md-head"
      : g.rule ? "tok-md-rule"
      : g.quote ? "tok-md-quote"
      : g.marker ? "tok-md-marker"
      : g.link ? "tok-md-link"
      : g.strong ? "tok-md-strong"
      : "tok-md-em";
    return `<span class="${cls}">${escapeHtml(m[0])}</span>`;
  });
}

const JSON_RE = new RegExp([
  String.raw`(?<key>"(?:[^"\\]|\\.)*"(?=\s*:))`,
  String.raw`(?<str>"(?:[^"\\]|\\.)*")`,
  String.raw`(?<num>-?\b\d+(?:\.\d+)?(?:[eE][-+]?\d+)?\b)`,
  String.raw`(?<lit>\b(?:true|false|null)\b)`,
  String.raw`(?<punct>[{}\[\],:])`,
].join("|"), "g");

function highlightJson(text) {
  let src = text;
  try { src = JSON.stringify(JSON.parse(text), null, 2); } catch { /* show as-is */ }
  return tokenize(src, JSON_RE, (m) => {
    const g = m.groups;
    const cls = g.key ? "tok-json-key"
      : g.str ? "tok-json-str"
      : g.num ? "tok-json-num"
      : g.lit ? "tok-json-lit"
      : "tok-json-punct";
    return `<span class="${cls}">${escapeHtml(m[0])}</span>`;
  });
}

function highlightFor(name, text) {
  if (name.endsWith(".bc")) return highlightBC(text);
  if (name.endsWith(".md")) return highlightMarkdown(text);
  if (name.endsWith(".json")) return highlightJson(text);
  return escapeHtml(text);
}

// --- State --------------------------------------------------------------
const state = {
  dirHandle: null,      // FileSystemDirectoryHandle when live, else null
  rootName: "",
  groups: new Map(),    // trajectoryId -> [{ name, getFile(), lastModified, size }]
  expanded: new Set(),
  selected: null,       // { trajectoryId, name }
  openMeta: null,       // { lastModified, size } of the file on screen
  seen: new Set(),      // trajectory ids present at the previous scan
  fresh: new Set(),     // ids that appeared on the most recent scan
  timer: null,
  scanning: false,
  live: false,
};

// --- Scanning -----------------------------------------------------------
// Two sources, same shape out: a live directory handle (re-readable, so the
// view can follow a running batch) or a one-shot <input webkitdirectory>
// snapshot (fallback for browsers without the File System Access API).
async function scanHandle(dirHandle) {
  const groups = new Map();
  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind !== "directory") continue;
    const files = [];
    await collectFiles(handle, "", files);
    if (files.length) groups.set(name, files);
  }
  return groups;
}

async function collectFiles(dirHandle, prefix, out) {
  for await (const [name, handle] of dirHandle.entries()) {
    const rel = prefix ? `${prefix}/${name}` : name;
    if (handle.kind === "directory") {
      await collectFiles(handle, rel, out);
    } else {
      const file = await handle.getFile();
      out.push({ name: rel, getFile: () => handle.getFile(),
                 lastModified: file.lastModified, size: file.size });
    }
  }
}

function groupsFromInput(fileList) {
  const groups = new Map();
  for (const file of fileList) {
    const parts = file.webkitRelativePath.split("/");
    if (parts.length < 3) continue;               // expects root/<trajectory>/<file>
    const id = parts[1];
    if (!groups.has(id)) groups.set(id, []);
    groups.get(id).push({ name: parts.slice(2).join("/"), getFile: async () => file,
                          lastModified: file.lastModified, size: file.size });
  }
  return groups;
}

// A record is in flight while its folder has no metadata.json — spawn_batch
// writes that only on success, and deletes the folder outright on failure.
// The catch: a run killed mid-record leaves the same shape behind forever, so
// anything untouched for STALE_MS is reported as stalled rather than working.
const STALE_MS = 5 * 60 * 1000;

function groupStatus(files) {
  if (files.some(f => f.name === "metadata.json")) return "done";
  const newest = Math.max(0, ...files.map(f => f.lastModified || 0));
  return (Date.now() - newest) < STALE_MS ? "working" : "stalled";
}

function counts() {
  let working = 0, stalled = 0;
  for (const files of state.groups.values()) {
    const s = groupStatus(files);
    if (s === "working") working++;
    else if (s === "stalled") stalled++;
  }
  return { total: state.groups.size, working, stalled };
}

function summary(extra) {
  const c = counts();
  const bits = [`${c.total} trajector${c.total === 1 ? "y" : "ies"}`];
  bits.push(`${c.working} active`);
  if (c.stalled) bits.push(`${c.stalled} stalled`);
  if (extra) bits.push(extra);
  return bits.join(" · ");
}

function sortGroups(groups) {
  const mode = document.getElementById("sort").value;
  const entries = [...groups.entries()];
  for (const [, files] of entries) files.sort((a, b) => a.name.localeCompare(b.name));
  if (mode === "newest") {
    const mtime = (files) => Math.max(...files.map(f => f.lastModified || 0));
    entries.sort((a, b) => mtime(b[1]) - mtime(a[1]));
  } else {
    entries.sort((a, b) => a[0].localeCompare(b[0]));
  }
  return new Map(entries);
}

// --- Rendering ----------------------------------------------------------
function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  const scrollTop = sidebar.scrollTop;
  sidebar.innerHTML = "";
  if (state.groups.size === 0) {
    sidebar.innerHTML = '<div class="empty">No subfolders found in this directory.</div>';
    return;
  }
  for (const [id, files] of state.groups) {
    const el = document.createElement("div");
    el.className = "trajectory" + (state.fresh.has(id) ? " is-new" : "");

    const nameEl = document.createElement("div");
    nameEl.className = "trajectory-name";
    const isOpen = state.expanded.has(id);
    const caret = document.createElement("span");
    caret.className = "caret";
    caret.textContent = isOpen ? "▼" : "▶";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = id;
    nameEl.append(caret, label);

    const status = groupStatus(files);
    if (status !== "done") {
      const ball = document.createElement("span");
      ball.className = "ball " + status;
      ball.title = status === "working" ? "in flight — no metadata.json yet"
                                       : "no metadata.json and untouched for a while — probably abandoned by a stopped run";
      nameEl.appendChild(ball);
    }

    const listEl = document.createElement("div");
    listEl.className = "file-list";
    listEl.style.display = isOpen ? "block" : "none";
    for (const entry of files) {
      const itemEl = document.createElement("div");
      itemEl.className = "file-item" + (entry.name.endsWith(".bc") ? " bc" : "");
      if (state.selected && state.selected.trajectoryId === id
          && state.selected.name === entry.name) itemEl.classList.add("active");
      itemEl.textContent = entry.name;
      itemEl.onclick = () => showFile(id, entry.name);
      listEl.appendChild(itemEl);
    }

    nameEl.onclick = () => {
      if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
      renderSidebar();
    };
    el.append(nameEl, listEl);
    sidebar.appendChild(el);
  }
  sidebar.scrollTop = scrollTop;
}

function setStatus(text, paused) {
  const el = document.getElementById("status");
  el.className = paused ? "paused" : "";
  el.innerHTML = state.dirHandle ? `<span class="dot"></span>${escapeHtml(text)}`
                                 : escapeHtml(text);
}

function findEntry(trajectoryId, name) {
  const files = state.groups.get(trajectoryId);
  return files ? files.find(f => f.name === name) : null;
}

async function showFile(trajectoryId, name, opts = {}) {
  state.selected = { trajectoryId, name };
  const entry = findEntry(trajectoryId, name);
  if (!entry) return;
  const file = await entry.getFile();
  const text = await file.text();
  state.openMeta = { lastModified: file.lastModified, size: file.size };

  const content = document.getElementById("content");
  const keepScroll = opts.reloaded ? content.scrollTop : 0;
  const note = opts.reloaded ? '<span class="reloaded">updated just now</span>' : "";
  content.innerHTML = `
    <div class="file-header">
      <span class="name">${escapeHtml(trajectoryId)}/${escapeHtml(name)}</span>${note}
      <button id="copy" title="Copy this file's contents">copy</button>
    </div>
    <pre>${highlightFor(name, text)}</pre>
  `;
  // Copies the raw text, not the highlighted DOM — a selection would carry the
  // markup's line breaks and lose nothing else of value.
  const copyBtn = document.getElementById("copy");
  copyBtn.onclick = async () => {
    await copyText(text);
    copyBtn.textContent = "copied";
    copyBtn.classList.add("copied");
    setTimeout(() => { copyBtn.textContent = "copy"; copyBtn.classList.remove("copied"); }, 1200);
  };
  content.scrollTop = keepScroll;
  if (!opts.keepSidebar) renderSidebar();
}

// navigator.clipboard is present on file:// in Chromium but not everywhere the
// fallback picker works, so keep the execCommand path for those browsers.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return;
  } catch { /* fall through */ }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } finally { ta.remove(); }
}

// --- Live refresh -------------------------------------------------------
// Re-reads the same directory handle on a timer, so a running batch shows up
// without re-picking the folder. Only re-renders when something actually
// changed, to avoid fighting the user's scroll position and open sections.
async function refresh() {
  if (!state.dirHandle || state.scanning) return;
  state.scanning = true;
  try {
    const scanned = await scanHandle(state.dirHandle);
    const before = signature(state.groups);
    state.groups = sortGroups(scanned);
    const after = signature(state.groups);

    const ids = new Set(state.groups.keys());
    state.fresh = new Set([...ids].filter(id => state.seen.size && !state.seen.has(id)));
    state.seen = ids;

    if (before !== after) renderSidebar();

    // If the open file changed on disk, re-read it in place.
    if (state.selected) {
      const entry = findEntry(state.selected.trajectoryId, state.selected.name);
      if (entry && state.openMeta
          && (entry.lastModified !== state.openMeta.lastModified
              || entry.size !== state.openMeta.size)) {
        await showFile(state.selected.trajectoryId, state.selected.name,
                       { reloaded: true, keepSidebar: true });
      }
    }
    const added = state.fresh.size ? `+${state.fresh.size} new` : "";
    setStatus(summary([added, new Date().toLocaleTimeString()].filter(Boolean).join(" · ")));
  } catch (err) {
    setStatus(`refresh failed: ${err.message}`, true);
  } finally {
    state.scanning = false;
  }
}

function restartTimer() {
  if (state.timer) clearInterval(state.timer);
  state.timer = null;
  const ms = Number(document.getElementById("interval").value);
  if (!state.dirHandle) return;
  if (ms > 0) {
    state.timer = setInterval(refresh, ms);
  } else {
    setStatus(summary("auto-refresh off"), true);
  }
}

// --- Remembering the folder ---------------------------------------------
// A directory handle survives a page reload if it's kept in IndexedDB —
// localStorage can't hold one, since it needs structured clone. The grant may
// not survive, so a recalled handle is re-checked before use, and a browser
// that wants to ask again is deferred to a click: requestPermission needs a
// user gesture, and firing it on load would throw.
const DB_NAME = "braincode-visualizer", STORE = "handles", KEY = "outputDir";

function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Remembering is a convenience: every failure here is swallowed so that a
// blocked or absent IndexedDB costs the folder's memory and nothing else.
async function rememberDir(handle) {
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(handle, KEY);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  } catch { /* ignore */ }
}

async function recallDir() {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get(KEY);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => rej(req.error);
    });
  } catch { return null; }
}

// --- Folder picking -----------------------------------------------------
async function openDirectory(handle) {
  state.dirHandle = handle;
  state.rootName = handle.name;
  state.seen = new Set();
  state.fresh = new Set();
  document.getElementById("path").textContent = handle.name;
  await refresh();
  if (state.groups.size && !state.expanded.size) {
    state.expanded.add(state.groups.keys().next().value);
    renderSidebar();
  }
  restartTimer();
  document.getElementById("content").innerHTML =
    '<div class="placeholder">Pick a file on the left. The folder is re-read on a timer, so new trajectories appear on their own.</div>';
}

document.getElementById("pick").onclick = async () => {
  if (window.showDirectoryPicker) {
    let handle;
    try {
      handle = await window.showDirectoryPicker({ mode: "read" });
    } catch (err) {
      if (err && err.name === "AbortError") return;   // user cancelled
      document.getElementById("folder-input").click(); // fall back
      return;
    }
    await openDirectory(handle);
    rememberDir(handle);
  } else {
    document.getElementById("folder-input").click();
  }
};

(async function restoreDirectory() {
  if (!window.showDirectoryPicker) return;             // snapshot mode can't re-read anyway
  const handle = await recallDir();
  if (!handle) return;
  let perm = "denied";
  try { perm = await handle.queryPermission({ mode: "read" }); } catch { return; }
  if (perm === "granted") { await openDirectory(handle); return; }
  if (perm !== "prompt") return;
  const content = document.getElementById("content");
  content.innerHTML =
    `<div class="placeholder">Last folder: <strong>${escapeHtml(handle.name)}</strong>`
    + ` — this browser wants to confirm access again.<br><br>`
    + `<button id="reopen">Reopen ${escapeHtml(handle.name)}</button></div>`;
  document.getElementById("reopen").onclick = async () => {
    let granted = "denied";
    try { granted = await handle.requestPermission({ mode: "read" }); } catch { /* denied */ }
    if (granted === "granted") await openDirectory(handle);
    else setStatus("access to the remembered folder was declined", true);
  };
})();

document.getElementById("folder-input").addEventListener("change", (e) => {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;
  state.dirHandle = null;                            // snapshot: cannot re-read
  state.rootName = files[0].webkitRelativePath.split("/")[0];
  state.groups = sortGroups(groupsFromInput(files));
  state.seen = new Set(state.groups.keys());
  state.fresh = new Set();
  state.expanded = new Set();
  if (state.groups.size) state.expanded.add(state.groups.keys().next().value);
  document.getElementById("path").textContent = state.rootName;
  renderSidebar();
  restartTimer();
  setStatus(summary("snapshot (re-pick to update)"), true);
  document.getElementById("content").innerHTML =
    '<div class="placeholder">Pick a file on the left.<br><br>This browser lacks the File System Access API, so the folder was read as a one-off snapshot — re-pick it to see new results.</div>';
});

document.getElementById("interval").onchange = () => { restartTimer(); refresh(); };
document.getElementById("sort").onchange = () => { state.groups = sortGroups(state.groups); renderSidebar(); };

// Cheap change detector: which trajectories exist, and each file's
// name/size/mtime. Enough to catch a new record, a rewritten file, or a
// pruned folder without diffing contents.
function signature(groups) {
  const parts = [];
  for (const [id, files] of groups) {
    parts.push(id + ":" + files.map(f => `${f.name},${f.size},${f.lastModified}`).join("|"));
  }
  return parts.join(";");
}
</script>
